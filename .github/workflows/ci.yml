name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Install forge-std (git submodules are not in the repo)
        run: forge install foundry-rs/forge-std --no-commit

      - name: Install npm dependencies (OpenZeppelin via node_modules)
        run: npm install --no-audit --no-fund

      - name: Show forge version
        run: forge --version

      - name: Build contracts
        run: forge build --sizes

      - name: Run Foundry tests
        run: forge test -vvv

      - name: Local E2E verification (no Foundry required)
        run: |
          npm install --no-audit --no-fund
          node scripts/verify-local.mjs

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Type-check & build
        run: npm run build
        env:
          NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID: future-kids-ci

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Boot check (no DB — index endpoints must 503, others 200)
        run: |
          node server.js &
          sleep 2
          curl -f http://localhost:4000/health
          curl -f http://localhost:4000/chapters
          curl -f http://localhost:4000/metadata/badge/0
