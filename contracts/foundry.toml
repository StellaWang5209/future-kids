[profile.default]
src = "src"
out = "out"
test = "test"
script = "script"
solc = "0.8.26"
evm_version = "shanghai"
optimizer = true
optimizer_runs = 200
remappings = [
    "@openzeppelin/contracts/=node_modules/@openzeppelin/contracts/",
    "forge-std/=lib/forge-std/src/"
]

[profile.ci]
fuzz = { runs = 1000 }
invariant = { runs = 100 }
